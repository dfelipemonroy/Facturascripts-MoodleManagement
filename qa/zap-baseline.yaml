# OWASP ZAP automation plan — MoodleManagement v2.0
#
# @since 2.0 — V2.0-ACTION-PLAN F12.4 · §F12.4
#
# Usage (from a Docker host with ZAP stable image):
#   docker run --rm -v "$PWD:/zap/wrk" -t ghcr.io/zaproxy/zaproxy:stable \
#     zap.sh -cmd -autorun /zap/wrk/qa/zap-baseline.yaml
#
# The job stops with a non-zero exit code if any HIGH or CRITICAL
# alert fires, or if the scan aborts mid-run. MEDIUM / LOW are
# reported but non-blocking for v2.0.

env:
  contexts:
    - name: MoodleManagement-v2.0
      urls:
        - ${MM_BASE_URL}/MoodleDashboard
        - ${MM_BASE_URL}/ListMoodleUserMap
        - ${MM_BASE_URL}/EditMoodleInstance
        - ${MM_BASE_URL}/MoodleCertificatePdf
        - ${MM_BASE_URL}/ApiMoodleWebhook
        - ${MM_BASE_URL}/ListMoodleAuditLog
        - ${MM_BASE_URL}/ListMoodleTrash
      authentication:
        method: form
        parameters:
          loginPageUrl: ${MM_BASE_URL}/
          loginRequestUrl: ${MM_BASE_URL}/
          loginRequestBody: user=${MM_USER}&password=${MM_PASSWORD}
          loggedInRegex: "\\Qadmin-area\\E"
          loggedOutRegex: "\\Qform-login\\E"
      users:
        - name: admin
          credentials:
            user: ${MM_USER}
            password: ${MM_PASSWORD}
      excludePaths:
        # FS core endpoints are upstream's responsibility.
        - ${MM_BASE_URL}/AdminPlugins
        - ${MM_BASE_URL}/User
        - ${MM_BASE_URL}/EditUser
        - ${MM_BASE_URL}/Logout
        # Large read-only pages slow ZAP without adding coverage.
        - ${MM_BASE_URL}/ListFacturaCliente
        - ${MM_BASE_URL}/ListCliente

  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: addOns
    parameters:
      install: ["pscanrules", "ascanrules", "reports"]

  - type: spider
    parameters:
      context: MoodleManagement-v2.0
      user: admin
      maxDuration: 5
      maxDepth: 5

  - type: spiderAjax
    parameters:
      context: MoodleManagement-v2.0
      user: admin
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: MoodleManagement-v2.0
      user: admin
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 30
      policy: Default Policy

  - type: report
    parameters:
      template: traditional-html-plus
      reportDir: /zap/wrk/qa/reports
      reportFile: v2.0-${date:yyyyMMdd-HHmm}
      displayReport: false

  - type: alertFilter
    # False positives to suppress — each has a written justification
    # below so future maintainers understand the rationale.
    parameters:
      filters:
        # FS core sets the cookie with SameSite=Lax, which ZAP
        # sometimes mis-parses as "SameSite not set" when wrapped
        # by the nginx proxy.
        - ruleId: 10054
          ruleName: "Cookie Without SameSite Attribute"
          url: "${MM_BASE_URL}/.*"
          newRisk: Info
          context: MoodleManagement-v2.0
        # Plugin emits a tight CSP only on PDF (F2.11). Other
        # endpoints inherit FS core's looser policy, which is
        # upstream's scope.
        - ruleId: 10055
          ruleName: "CSP"
          url: "${MM_BASE_URL}/(?!MoodleCertificatePdf).*"
          newRisk: Info
          context: MoodleManagement-v2.0
