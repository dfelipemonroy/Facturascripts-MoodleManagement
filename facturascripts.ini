name = "MoodleManagement"
description = "Gestión de instancias Moodle, integración API, sincronización de cursos, matrículas y roles desde FacturaScripts. Requires Moodle >= 4.1 (see docs/SUPPORTED-VERSIONS.md)."
version = 2.0
; STD-02 (2026-04-17) — bumped from 2025.6 to 2025.8. The plugin uses
; FS core APIs introduced between 2025.6 and 2025.8 (notably
; Html::addFunction for the FE-02 Twig helper registration + the
; cooperative cron lock backend). 2025.6 would boot but the helpers
; silently no-op, which is worse than failing loudly at install.
min_version = 2025.8
min_php = 8.0
